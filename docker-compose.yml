services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: samplesift
      POSTGRES_USER: samplesift
      POSTGRES_PASSWORD: samplesift
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samplesift -d samplesift"]
      interval: 5s
      timeout: 5s
      retries: 10
