[project]
name = "samplesift"
version = "0.1.0"
description = "Spatial querying and selection of geolocation-tagged data"
readme = { file = "README", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
django = [
  "Django>=6.0,<6.1",
  "django-ninja>=1.5,<2",
  "pygeofilter>=0.3,<0.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pre-commit>=4.0,<5",
  "pytest>=9.0,<10",
  "pytest-django>=4.11,<5",
  "psycopg[binary]>=3.2,<4",
  "Django>=6.0,<6.1",
  "django-ninja>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
format_attribute_template_tags = true
