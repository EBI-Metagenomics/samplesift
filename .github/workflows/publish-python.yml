name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Check Python release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Python release tag must be v$version"
            exit 1
          fi
          # npm publishes from the same tag, so its version must match too.
          npm_version="$(jq -r .version frontend/packages/components/package.json)"
          if [ "$npm_version" != "$version" ]; then
            echo "::error::npm version $npm_version must match Python version $version for a shared release"
            exit 1
          fi

  test-python:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: validate-release
    uses: ./.github/workflows/test-python.yml

  test-frontend:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: validate-release
    uses: ./.github/workflows/test-frontend.yml
    with:
      release_checks: true

  build:
    name: build
    if: startsWith(github.event.release.tag_name, 'v')
    needs: [test-python, test-frontend]
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build Django static components
        run: npm run build:django --prefix frontend

      - name: Build Jupyter widget
        run: npm run build:jupyter --prefix frontend

      - name: Build wheel and source distribution
        run: uv build

      - name: Check Python distribution contents
        run: python scripts/check-python-package.py dist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  # Runs only the official action with the OIDC token; no repository code.
  publish:
    name: publish to PyPI
    if: startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/samplesift
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3
