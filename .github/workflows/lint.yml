name: Lint

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3 

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Python dependencies
        run: uv sync --locked --extra jupyter

      - name: Lint Python with Ruff
        run: uvx ruff@0.17.3 check --no-fix .

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend components
        run: npm run build --prefix frontend

      - name: Test frontend data layer
        run: npm test --prefix frontend

      - name: Test Jupyter wrapper
        run: uv run --locked --extra jupyter pytest -p no:django tests/test_jupyter.py

      - name: Lint with Biome
        run: uv run pre-commit run biome-lint --all-files
