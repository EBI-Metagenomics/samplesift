name: Test frontend

on:
  workflow_call:
    inputs:
      release_checks:
        description: Run lint and browser checks before publishing either package.
        type: boolean
        default: false
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/test-frontend.yml
  merge_group:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test release tag validation
        run: node --test tests/check-npm-release.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        if: inputs.release_checks
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build components
        run: npm run build

      - name: Build Django static components
        run: npm run build:django

      - name: Check package contents
        run: npm run check:package --workspace @microbiome-informatics/samplesift

      - name: Pack package (dry run)
        working-directory: frontend/packages/components
        run: npm pack --dry-run

      - name: Install Chromium for release checks
        if: inputs.release_checks
        run: npx playwright install --with-deps chromium

      - name: Run browser release checks
        if: inputs.release_checks
        run: npm run test:browser
