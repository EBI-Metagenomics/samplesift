name: Test frontend

on:
  workflow_call:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/test-frontend.yml
  merge_group:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build components
        run: npm run build

      - name: Check package contents
        run: npm run check:package --workspace @samplesift/components

      - name: Pack package (dry run)
        working-directory: frontend/packages/components
        run: npm pack --dry-run
