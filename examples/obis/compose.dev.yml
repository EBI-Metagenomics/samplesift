services:
  app:
    environment:
      PYTHONPATH: /app/src
    ports: !override
      - "127.0.0.1:${SAMPLESIFT_BACKEND_PORT:-8002}:8000"
    volumes:
      - ../../src:/app/src:ro
      - .:/app/examples/obis:ro
    command: []
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/samplesift/collections/occurrences/queryables', timeout=3).close()"
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 60
